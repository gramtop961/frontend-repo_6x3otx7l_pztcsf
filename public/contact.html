<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — SteelBuild Co.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css" />
  <script defer src="/assets/app.js"></script>
</head>
<body>
  <div class="loader-overlay"><div class="spinner"></div></div>

  <nav class="navbar">
    <div class="container inner">
      <a href="/home.html" class="brand"><div class="logo"></div><span>SteelBuild Co.</span></a>
      <div class="nav-links"><a href="/home.html">Home</a><a href="/services.html">Services</a><a href="/projects.html">Projects</a><a href="/contact.html">Contact</a></div>
      <button class="menu-btn" data-menu>Menu</button>
    </div>
    <div class="mobile-menu" id="mobileMenu"><div class="container"><a href="/home.html">Home</a><a href="/services.html">Services</a><a href="/projects.html">Projects</a><a href="/contact.html">Contact</a></div></div>
  </nav>

  <section class="section">
    <div class="container">
      <h2>Contact Us</h2>
      <p class="lead">We respond within 24 hours.</p>
      <div class="grid cols-2">
        <div>
          <form class="form" data-validate>
            <div>
              <label>Name</label>
              <input type="text" name="name" class="input" placeholder="Your full name"/>
              <div class="error" data-err="name"></div>
            </div>
            <div>
              <label>Email</label>
              <input type="email" name="email" class="input" placeholder="you@example.com"/>
              <div class="error" data-err="email"></div>
            </div>
            <div>
              <label>Phone</label>
              <input type="tel" name="phone" class="input" placeholder="+1 (555) 000-0000"/>
              <div class="error" data-err="phone"></div>
            </div>
            <div>
              <label>Message</label>
              <textarea name="message" rows="5" class="input" placeholder="Tell us about your project..."></textarea>
              <div class="error" data-err="message"></div>
            </div>
            <div class="mt-3">
              <button class="btn cta" type="submit">Send Message</button>
              <a class="btn dark" href="https://wa.me/15551234567" target="_blank" rel="noopener">WhatsApp</a>
            </div>
          </form>

          <div class="mt-4">
            <h3>Contact Details</h3>
            <p class="muted">Phone: (555) 123-4567<br/>Email: hello@steelbuild.co<br/>Address: 100 Industrial Ave, Suite 200, Metropolis</p>
          </div>
        </div>
        <div>
          <iframe class="card" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.835434509252!2d144.9556513153157!3d-37.81732797975171!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad642af0f11fd81%3A0xf5778e3e2f2d3df!2sEnvato!5e0!3m2!1sen!2sus!4v1614641464973!5m2!1sen!2sus" width="100%" height="350" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer"><div class="container row"><p>© 2025 SteelBuild Co.</p><div class="socials"><a href="#">T</a><a href="#">in</a></div></div></footer>
</body>
</html>
